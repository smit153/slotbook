# CI on every push and pull request. Two jobs run in parallel:
#  - test: secret scan (full history), typecheck, lint, build, and every Vitest test
#          (unit, integration and web; Testcontainers starts Postgres using the runner's Docker)
#  - e2e:  Playwright (Chromium) against the production Docker build (scripts/e2e.sh)
# Action versions: the current major of each, all on the node24 runtime (checked Nov 2026).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Secrets, typecheck, lint, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Secret scan (gitleaks, every commit)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --log-opts="--all"

      - uses: pnpm/action-setup@v6 # pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  e2e:
    name: Playwright (Chromium) against the Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: Upload Playwright report, traces and app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
